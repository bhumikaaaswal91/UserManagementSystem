<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password - User Management System</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

    <div class="container container-sm">
        <h1>Change Password</h1>

        <!-- Success state -->
        <div th:if="${changeSuccess}" class="success-message">
            <strong>Password changed successfully!</strong>
            Your password has been updated.
        </div>
        <div th:if="${changeSuccess}" class="form-actions">
            <a th:href="@{/}" class="btn btn-primary">Back to Dashboard</a>
        </div>

        <!-- Change password form -->
        <div th:unless="${changeSuccess}">
            <p class="subtitle">Enter your current password and choose a new one.</p>

            <form th:action="@{/change-password/{id}(id=${userId})}" th:object="${changePasswordDto}" method="post" id="change-password-form" novalidate>

                <div class="form-group">
                    <label for="currentPassword">Current Password</label>
                    <input type="password" id="currentPassword" th:field="*{currentPassword}"
                           placeholder="Enter current password" autocomplete="current-password">
                    <span class="field-error" th:if="${#fields.hasErrors('currentPassword')}" th:errors="*{currentPassword}"></span>
                    <span class="field-error" id="currentPassword-error"></span>
                </div>

                <div class="form-group">
                    <label for="newPassword">New Password</label>
                    <input type="password" id="newPassword" th:field="*{newPassword}"
                           placeholder="Enter new password" autocomplete="new-password">
                    <span class="field-error" th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}"></span>
                    <span class="field-error" id="newPassword-error"></span>

                    <!-- Password strength indicator -->
                    <div class="password-strength" id="password-strength">
                        <div class="strength-bar">
                            <div class="strength-fill" id="strength-fill"></div>
                        </div>
                        <span class="strength-label" id="strength-label"></span>
                    </div>

                    <ul class="password-requirements" id="password-requirements">
                        <li id="req-length"><span class="req-icon">&#10007;</span> At least 8 characters</li>
                        <li id="req-upper"><span class="req-icon">&#10007;</span> One uppercase letter</li>
                        <li id="req-lower"><span class="req-icon">&#10007;</span> One lowercase letter</li>
                        <li id="req-digit"><span class="req-icon">&#10007;</span> One digit</li>
                        <li id="req-special"><span class="req-icon">&#10007;</span> One special character (@$!%*?&#+\-_)</li>
                    </ul>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm New Password</label>
                    <input type="password" id="confirmPassword" th:field="*{confirmPassword}"
                           placeholder="Confirm new password" autocomplete="new-password">
                    <span class="field-error" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></span>
                    <span class="field-error" id="confirmPassword-error"></span>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Change Password</button>
                    <a th:href="@{/}" class="btn btn-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const form = document.getElementById('change-password-form');
            if (!form) return;

            const currentPwd = document.getElementById('currentPassword');
            const newPwd = document.getElementById('newPassword');
            const confirmPwd = document.getElementById('confirmPassword');
            const currentPwdError = document.getElementById('currentPassword-error');
            const newPwdError = document.getElementById('newPassword-error');
            const confirmPwdError = document.getElementById('confirmPassword-error');
            const strengthFill = document.getElementById('strength-fill');
            const strengthLabel = document.getElementById('strength-label');

            const requirements = {
                length: document.getElementById('req-length'),
                upper: document.getElementById('req-upper'),
                lower: document.getElementById('req-lower'),
                digit: document.getElementById('req-digit'),
                special: document.getElementById('req-special')
            };

            function checkRequirements(pwd) {
                const checks = {
                    length: pwd.length >= 8,
                    upper: /[A-Z]/.test(pwd),
                    lower: /[a-z]/.test(pwd),
                    digit: /\d/.test(pwd),
                    special: /[@$!%*?&#+\-_]/.test(pwd)
                };

                let passed = 0;
                for (const [key, met] of Object.entries(checks)) {
                    const li = requirements[key];
                    const icon = li.querySelector('.req-icon');
                    if (met) {
                        li.classList.add('met');
                        li.classList.remove('unmet');
                        icon.innerHTML = '&#10003;';
                        passed++;
                    } else {
                        li.classList.add('unmet');
                        li.classList.remove('met');
                        icon.innerHTML = '&#10007;';
                    }
                }

                const percent = (passed / 5) * 100;
                strengthFill.style.width = percent + '%';
                if (passed <= 1) {
                    strengthFill.className = 'strength-fill strength-weak';
                    strengthLabel.textContent = passed === 0 ? '' : 'Weak';
                } else if (passed <= 3) {
                    strengthFill.className = 'strength-fill strength-fair';
                    strengthLabel.textContent = 'Fair';
                } else if (passed === 4) {
                    strengthFill.className = 'strength-fill strength-good';
                    strengthLabel.textContent = 'Good';
                } else {
                    strengthFill.className = 'strength-fill strength-strong';
                    strengthLabel.textContent = 'Strong';
                }

                return passed === 5;
            }

            function validateCurrentPassword() {
                if (!currentPwd.value) {
                    showError(currentPwd, currentPwdError, 'Current password is required');
                    return false;
                }
                clearError(currentPwd, currentPwdError);
                return true;
            }

            function validateNewPassword() {
                const pwd = newPwd.value;
                if (!pwd) {
                    showError(newPwd, newPwdError, 'New password is required');
                    return false;
                }
                if (pwd === currentPwd.value) {
                    showError(newPwd, newPwdError, 'New password must be different from current password');
                    return false;
                }
                const allMet = checkRequirements(pwd);
                if (!allMet) {
                    showError(newPwd, newPwdError, 'Password does not meet all requirements');
                    return false;
                }
                clearError(newPwd, newPwdError);
                return true;
            }

            function validateConfirm() {
                if (!confirmPwd.value) {
                    showError(confirmPwd, confirmPwdError, 'Please confirm your new password');
                    return false;
                }
                if (newPwd.value !== confirmPwd.value) {
                    showError(confirmPwd, confirmPwdError, 'Passwords do not match');
                    return false;
                }
                clearError(confirmPwd, confirmPwdError);
                return true;
            }

            currentPwd.addEventListener('blur', validateCurrentPassword);
            newPwd.addEventListener('input', function() {
                checkRequirements(newPwd.value);
                if (newPwd.value) clearError(newPwd, newPwdError);
                if (confirmPwd.value) validateConfirm();
            });
            newPwd.addEventListener('blur', validateNewPassword);
            confirmPwd.addEventListener('input', validateConfirm);
            confirmPwd.addEventListener('blur', validateConfirm);

            form.addEventListener('submit', function(e) {
                const v1 = validateCurrentPassword();
                const v2 = validateNewPassword();
                const v3 = validateConfirm();
                if (!v1 || !v2 || !v3) e.preventDefault();
            });

            function showError(input, errorSpan, msg) {
                input.classList.add('is-invalid');
                errorSpan.textContent = msg;
            }

            function clearError(input, errorSpan) {
                input.classList.remove('is-invalid');
                errorSpan.textContent = '';
            }
        });
    </script>

</body>
</html>
