<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - User Management System</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

    <div class="container container-sm">
        <h1>Reset Your Password</h1>
        <p class="subtitle">Enter your registered email address and we'll send you a password reset link.</p>

        <!-- Success message -->
        <div th:if="${success}" class="success-message">
            <span th:text="${success}">Success</span>
        </div>

        <!-- Fallback reset link (shown if email fails) -->
        <div th:if="${resetLink}" class="reset-link-box">
            <a th:href="${resetLink}" class="reset-link" id="reset-link">Click here to reset your password</a>
        </div>

        <!-- Error message -->
        <div th:if="${error}" class="error-message">
            <span th:text="${error}">Error message</span>
        </div>

        <!-- Form (hidden on success) -->
        <form th:unless="${success}" th:action="@{/forgot-password}" method="post" id="forgot-password-form" novalidate>
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email"
                       th:value="${email}"
                       placeholder="username@example.com"
                       autocomplete="email">
                <span class="field-error" id="email-error"></span>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Send Reset Link</button>
                <a th:href="@{/login}" class="btn btn-secondary">Back to Login</a>
            </div>
        </form>

        <div th:if="${success}" class="form-actions" style="margin-top: 1.5rem;">
            <a th:href="@{/login}" class="btn btn-secondary">Back to Login</a>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const form = document.getElementById('forgot-password-form');
            if (!form) return;

            const emailInput = document.getElementById('email');
            const emailError = document.getElementById('email-error');

            function validateEmail() {
                const email = emailInput.value.trim();
                if (!email) {
                    showError(emailInput, emailError, 'Email address is required');
                    return false;
                }
                const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                if (!emailRegex.test(email)) {
                    showError(emailInput, emailError, 'Please enter a valid email address');
                    return false;
                }
                clearError(emailInput, emailError);
                return true;
            }

            emailInput.addEventListener('input', function() {
                if (emailInput.value.trim()) clearError(emailInput, emailError);
            });
            emailInput.addEventListener('blur', validateEmail);

            form.addEventListener('submit', function(e) {
                if (!validateEmail()) {
                    e.preventDefault();
                }
            });

            function showError(input, errorSpan, msg) {
                input.classList.add('is-invalid');
                errorSpan.textContent = msg;
            }

            function clearError(input, errorSpan) {
                input.classList.remove('is-invalid');
                errorSpan.textContent = '';
            }
        });
    </script>

</body>
</html>
