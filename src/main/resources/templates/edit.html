<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit User - User Management System</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

    <div class="container">
        <h1>Update User Details</h1>
        <p class="subtitle">Modify the fields below to update the user account information.</p>

        <form th:action="@{/edit/{id}(id=${user.id})}" th:object="${user}" method="post">
            <!-- Hidden field to bind User ID -->
            <input type="hidden" th:field="*{id}">

            <div class="form-group">
                <label for="name">Name</label>
                <input type="text" id="name" th:field="*{name}" placeholder="Enter full name" required autocomplete="name">
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" th:field="*{email}" placeholder="username@example.com" required autocomplete="email">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" th:field="*{password}" placeholder="Update password" required autocomplete="new-password">
            </div>

            <div class="form-group checkbox-group">
                <input type="checkbox" id="verified" th:field="*{verified}">
                <label for="verified">Account Verified</label>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Save Changes</button>
                <a th:href="@{/}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>

</body>
</html>
